<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#C41E3A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />

    <title>PhoBo - Доставка вьетнамской еды</title>
    <meta name="description" content="Заказ и доставка вьетнамских блюд. Традиционные супы Фо, лапша, роллы и многое другое." />

    <!-- Telegram Web App Script -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <!-- Preconnect to external resources -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <style>
      /* Critical CSS for fast initial load */
      html, body, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100vh;
        background-color: #FFF8F0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }

      /* Initial loading state */
      .initial-loader {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background-color: #FFF8F0;
      }

      .initial-loader-content {
        text-align: center;
      }

      .initial-loader-logo {
        width: 64px;
        height: 64px;
        background-color: #C41E3A;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 16px;
      }

      .initial-loader-logo span {
        color: white;
        font-size: 32px;
        font-weight: bold;
      }

      .initial-loader-text {
        color: #3E2723;
        font-size: 24px;
        font-weight: 700;
      }

      .initial-loader-spinner {
        margin-top: 24px;
        width: 32px;
        height: 32px;
        border: 3px solid #E0E0E0;
        border-top-color: #C41E3A;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin-left: auto;
        margin-right: auto;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <!-- Initial loading state shown before React loads -->
      <div class="initial-loader">
        <div class="initial-loader-content">
          <div class="initial-loader-logo">
            <span>P</span>
          </div>
          <div class="initial-loader-text">PhoBo</div>
          <div class="initial-loader-spinner"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
